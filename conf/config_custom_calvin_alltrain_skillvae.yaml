defaults:
  - _self_
  - callbacks: custom_calvin_alltrain
  - datamodule: custom_calvin_alltrain
  - model: flower
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog

root_data_dir: /home/jack/flower_vla_calvin/multi_task_dataset_raw_action_alltrain
lang_folder: lang_clip_resnet50

log_dir: /data2/jack/log
slurm: false
seed: 242
device: 'cuda'
batch_size: 16
devices: 2
act_dim: 7
proprio_dims: 11
obs_dim: 512
goal_dim: 512
obs_seq_len: 1
act_seq_len: 10
multistep: 10
p_last_state: 0
gen_img_res: 112
max_epochs: 20
num_workers: 4
benchmark_name: custom_flower
use_extracted_rel_actions: false

trainer:
  devices: ${devices}
  precision: 16-mixed
  max_epochs: ${max_epochs}
  sync_batchnorm: false
  accelerator: gpu
  strategy: "ddp"
  limit_train_batches: 1.0
  limit_val_batches: 0
  num_sanity_val_steps: 0

logger:
  _target_: pytorch_lightning.loggers.WandbLogger
  save_dir: ${log_dir}
  name: jack_usb_training
  group: vla_real_data
  project: flower_cond_skill_xyRemoved_check
  entity: hjm20720-d
  id: ???

model:
  load_pretrained: True
  pretrained_model_path: /home/jack/flower_vla_calvin/flower_vla_pret/360000_model_weights.pt
  lowdim_obs_dim: 11
  use_proprio_skill_history_mlp_adaln: true
  use_skill_vae_adaln: true
  use_skill_vae_adaln_conv1d: false
  skill_vae_ckpt_path: /home/jack/multitask_model_epoch_0200.pth
  history_adaln_source: skill_vae
  skill_vae_cond_pool: mean
  skill_vae_strict_load: false
  skill_vae_allow_zero_history: false
  skill_vae_relabel_gripper: true
  skill_vae_gripper_action_idx: -1
  skill_vae_gripper_state_idx: 6
  skill_vae_relabel_action_threshold: 0.9
  skill_vae_relabel_state_threshold: 0.95
  skill_vae_relabel_require_state: false

hydra:
  run:
    dir: ${log_dir}/runs/${now:%Y-%m-%d}/${now:%H-%M-%S}_seed${seed}
  sweep:
    dir: ${log_dir}/runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
  job:
    config:
      override_dirname:
        exclude_keys:
          - log_dir
          - datamodule.root_data_dir
          - trainer.gpus
          - datamodule.num_workers
          - trainer.limit_train_batches
          - trainer.limit_val_batches
