# FLOWERVLA Configuration
_target_: flower.models.flower.FLOWERVLA
_recursive_: false

# VLM Configuration
vlm_path: microsoft/Florence-2-large
freeze_florence: False
freeze_vision_tower: False
vlm_prompt_style: default
token_dropout: 0.1  # Added token dropout parameter

# Model Structure
multistep: ${multistep}
num_sampling_steps: 4
lowdim_obs_dim: 11
action_dim: 7
act_window_size: ${act_seq_len}

# pretraining stuff
load_pretrained: true
pretrained_model_path: /home/jack/Skilled_FLOWER/flower_vla_pret/360000_model_weights.pt

# Model flags
use_second_view: True
second_view_key: image_wrist
action_type_adaln: True
use_causal_attention: true
use_cross_attn: True
use_adaln_cond: false  # VLM pooling into AdaLN; F/T conditioning is independent.
use_readout_token: false
use_proprio: True
return_act_chunk: false

# Optional F/T conditioning. The SFM config enables this GRU -> DiT AdaLN path.
use_force_history_adaln: false
force_history_encoder_type: gru
force_history_dim: 6
force_history_hidden_dim: 128
force_history_gru_layers: 1
force_history_dropout: 0.0
force_history_length: null
# Legacy sum conditioning remains the default for existing checkpoints/configs.
force_history_latent_dim: 128
adaln_conditioning_type: sum
adaln_conditioning_hidden_dim: null

# Frozen Quest_SFM ID2430 skills. Existing experiments remain disabled.
skill_source: none  # none | current (Stage-II prior) | history (action encoder) | both
quest_project_root: null
quest_checkpoint_path: null
quest_clip_snapshot: null
skill_cond_pool: mean

# DiT Configuration
sampling_type: uniform
dit_dim: 1024
n_heads: 16
n_layers: 12
attn_pdrop: 0.1
resid_pdrop: 0.1
mlp_pdrop: 0.1

# Auxiliary BBox Loss
bbox_loss: false
bbox_loss_weight: 0.05
bbox_key: bbox

# RoPE Configuration
use_rope: true
use_nope: false
query_seq_len: 100
rope_theta: 32.0

# Optimizer Configuration
optimizer_type: adamw

optimizer:
  _target_: torch.optim.AdamW
  transformer_weight_decay: 0.05
  learning_rate: 2e-5
  betas: [0.9, 0.95]

# Learning Rate Scheduler
lr_scheduler:
  lr_scheduler:
    init_lr: 2e-5
    init_lr_scale: 0.1
    final_lr_scale: 0.5
    total_steps: 50000
    phase_ratio: "(0.05, 0.1, 0.85)"
    lr: 2e-5
