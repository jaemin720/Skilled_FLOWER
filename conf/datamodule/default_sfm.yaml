defaults:
  - transforms: default_sfm_transforms

_target_: flower.datasets.hulc_data_module.HulcDataModule
_recursive_: false
root_data_dir: ${root_data_dir}
use_validation: false
action_space: 7
action_max: [1., 1., 1., 1., 1., 1., 1.]
action_min: [-1., -1., -1., -1., -1., -1., -1.]
shuffle_val: false

observation_space:
  rgb_obs: [rgb_static, rgb_gripper]
  depth_obs: []
  state_obs: [robot_obs]
  actions: [rel_actions]
  language: [language]

# Stored order: gripper,x,y,z,roll,pitch,yaw,vx,vy,vz,wx,wy,wz.
# Force and torque were removed during preprocessing; FT enters via history only.
# Keep the complete 13-D state by default. To remove XY, use
# keep_indices=[[0,1],[3,13]], n_state_obs=11, model.lowdim_obs_dim=11.
proprioception_dims:
  n_state_obs: ${proprio_dims}
  keep_indices: [[0, 13]]
  normalize: false
  normalize_robot_orientation: false

datasets:
  lang_dataset:
    _target_: flower.datasets.sfm_dataset.SfmDiskDataset
    key: lang
    save_format: npz
    batch_size: ${batch_size}
    # For obs_seq_len=1, a training window contains act_seq_len stored actions.
    min_window_size: ${act_seq_len}
    max_window_size: ${act_seq_len}
    proprio_state: ${datamodule.proprioception_dims}
    obs_space: ${datamodule.observation_space}
    skip_frames: 1
    pad: false
    lang_folder: ${lang_folder}
    aux_lang_loss_window: 8
    num_workers: ${num_workers}
    action_seq_len: ${act_seq_len}
    obs_seq_len: ${obs_seq_len}
    future_range: 1
    use_extracted_rel_actions: true
    extracted_dir: ${root_data_dir}/training/extracted
    load_force_history: true
    force_history_key: right_force_history
    load_bbox: false
    shared_color_jitter: true
    # 'physical' selects the exported unnormalized 13-D state; same angle wrapping.
    proprio_source: normalized
